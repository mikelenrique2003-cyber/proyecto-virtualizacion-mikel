# /etc/ssh/sshd_config.d/01-hardening.conf
# Se llama 01- a propósito: sshd se queda con el PRIMER valor que lee
# y los ficheros se leen en orden alfabético. Un 50-cloud-init.conf con
# "PasswordAuthentication yes" ganaría a un 99-hardening.conf.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowUsers __ADMIN_USER__
