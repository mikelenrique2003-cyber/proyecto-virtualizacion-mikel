# =====================================================================
#  Proxy inverso: todo por 443 y por nombre. El 80 solo redirige.
#  Certificado autofirmado con SAN para los cuatro nombres
#  (scripts/generar-certificado.sh).
# =====================================================================

# Cabeceras comunes que reciben las aplicaciones
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;

ssl_certificate     /etc/nginx/certs/pyme.crt;
ssl_certificate_key /etc/nginx/certs/pyme.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

server_tokens off;
client_max_body_size 1G;

# --- HTTP -> HTTPS ----------------------------------------------------
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- Nombre desconocido o acceso por IP: se rechaza -------------------
server {
    listen 443 ssl default_server;
    server_name _;
    return 444;
}

# --- Joomla: www.pyme.lan ---------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.pyme.lan pyme.lan;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://joomla:80;
    }
}

# --- GLPI: soporte.pyme.lan -------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name soporte.pyme.lan;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://glpi:80;
    }
}

# --- Nextcloud: nube.pyme.lan -----------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name nube.pyme.lan;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;

    location /.well-known/carddav { return 301 https://$host/remote.php/dav; }
    location /.well-known/caldav  { return 301 https://$host/remote.php/dav; }

    location / {
        proxy_pass http://nextcloud:80;
    }
}

# --- Uptime Kuma: estado.pyme.lan (usa WebSockets) --------------------
server {
    listen 443 ssl;
    http2 on;
    server_name estado.pyme.lan;
    location / {
        proxy_pass http://uptime-kuma:3001;
        proxy_http_version 1.1;
        # Al definir proxy_set_header aquí se pierden los heredados: se repiten
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
